# Entorno local completo con un solo comando: `docker compose up --build`.
# - db: TimescaleDB con los datos públicos (F3).
# - backend: API de solo lectura; escucha en el loopback de su contenedor.
# - frontend: nginx con la app; comparte el espacio de red del backend para llegar a él por
#   127.0.0.1 y publica el Centro de Mando solo en 127.0.0.1:8080 del equipo.
# Sin secretos en este fichero: la base escucha en 127.0.0.1 y la app no tiene autenticación en
# modo local. En el VPS: `sops exec-env ... 'docker compose up -d'` con acceso por Tailscale (README).
name: agente-trading

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: trading
      POSTGRES_DB: trading
      # Solo para desarrollo local: sin contraseña porque el puerto es 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      args:
        # `CODE_COMMIT=$(git rev-parse --short=12 HEAD) docker compose up --build`
        CODE_COMMIT: ${CODE_COMMIT:-desconocido}
    environment:
      # Local: sin autenticación (solo 127.0.0.1). VPS: `sops exec-env` aporta TRADING_API_AUTH=on
      # y los tres secretos; si falta alguno, el backend se niega a arrancar (ADR-015).
      TRADING_API_AUTH: ${TRADING_API_AUTH:-disabled}
      TRADING_API_PASSWORD_HASH: ${TRADING_API_PASSWORD_HASH:-}
      TRADING_API_TOTP_SECRET: ${TRADING_API_TOTP_SECRET:-}
      TRADING_API_SESSION_KEY: ${TRADING_API_SESSION_KEY:-}
      TRADING_API_SECURE_COOKIE: ${TRADING_API_SECURE_COOKIE:-0}
      TRADING_DB_DSN: postgresql://trading@db:5432/trading
    volumes:
      - ./data:/app/data:ro
      - app-state:/app/state
      - ./docs:/app/docs:ro
      - ./research:/app/research:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/estado')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: ops/docker/frontend.Dockerfile
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  app-state:
