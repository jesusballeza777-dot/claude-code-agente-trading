# Entorno local: base de datos de investigación (F3). El backend y el Centro de Mando se
# añaden en la Ola 3. Sin secretos: la base solo escucha en 127.0.0.1 y contiene datos
# públicos. En el VPS no se publica el puerto y la contraseña llega por SOPS (F6).
name: agente-trading

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: trading
      POSTGRES_DB: trading
      # Solo para desarrollo local: sin contraseña porque el puerto es 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
