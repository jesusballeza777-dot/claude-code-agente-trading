[project]
name = "agente-trading"
version = "0.0.1"
description = "Agente de trading cripto con Claude (F0 + cimientos de F2). Sin conexión a exchanges."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Sin dependencias de runtime: el motor de riesgo es código puro con la biblioteca estándar.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "ruff>=0.17.2",
    "mypy>=2.4",
    "pre-commit>=4.7",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading"

# --- pytest -----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

# --- coverage ---------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["trading"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]

# --- ruff -------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit: seguridad
    "DTZ",      # fechas sin zona horaria
    "SIM",      # simplificaciones
    "PT",       # estilo de pytest
    "RUF",      # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert es el mecanismo de pytest

# --- mypy -------------------------------------------------------------------------
# Base razonable para todo el código; strict completo en risk/ y execution/ (CLAUDE.md).
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src:tests"
explicit_package_bases = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["trading.risk", "trading.risk.*", "trading.execution", "trading.execution.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
warn_unreachable = true
